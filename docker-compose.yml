# CareCart - local infrastructure.
#
#   docker compose up -d           # start postgres + backend
#   docker compose logs -f backend
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop, wipe the postgres volume
#
# Requires Docker Engine 20.10+ and Compose v2 (`docker compose`, NOT the old
# hyphenated `docker-compose` v1 - the top-level `name:` key below needs v2).
#
# Host-port conflicts (a teammate already running Postgres on 5432, etc.):
# override without editing this file -
#   POSTGRES_HOST_PORT=5434 BACKEND_HOST_PORT=8001 docker compose up -d
# or put those in a repo-root .env (see .env.example at the repo root).
# Defaults are 5433 (Postgres) and 8000 (backend) to dodge the common clash.
#
# The vector stack (Milvus) lives in infra/docker-compose.yml and attaches to
# the same project:  docker compose -f infra/docker-compose.yml up -d

name: carecart

services:
  postgres:
    image: postgres:15
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are read from backend/.env
    env_file:
      - backend/.env
    ports:
      # HOST:CONTAINER - host side overridable to avoid clashing with a local Postgres
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-carecart}\" -d \"$${POSTGRES_DB:-carecart}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      # reach the DB service by its compose name + the in-network port (5432),
      # regardless of what backend/.env says (that value is for host-run uvicorn)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # if the vector stack is also up, reach Milvus by its service name
      MILVUS_HOST: milvus
      # entrypoint runs `alembic upgrade head` on start; set to 0 to disable
      AUTO_MIGRATE: "1"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # live-reload against the working tree during development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - /app/.venv          # keep any host .venv from shadowing the image
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
