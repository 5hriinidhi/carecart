# CareCart - local infrastructure.
#
#   docker compose up -d           # start postgres + backend
#   docker compose logs -f backend
#   docker compose exec backend alembic upgrade head
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop, wipe the postgres volume
#
# The vector stack (Milvus) lives in infra/docker-compose.yml and attaches to
# the same project:  docker compose -f infra/docker-compose.yml up -d
#
# Requires Docker Desktop to be running.

name: carecart

services:
  postgres:
    image: postgres:15
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are read from backend/.env
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-carecart}\" -d \"$${POSTGRES_DB:-carecart}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      # reach the DB service by its compose name, not localhost
      POSTGRES_HOST: postgres
      # if the vector stack is also up, reach Milvus by its service name
      MILVUS_HOST: milvus
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # live-reload against the working tree during development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - /app/.venv          # keep any host .venv from shadowing the image
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
